# Publica pair-screen quando o código da função mudar (evita 404 no pareamento TV).
name: Deploy Supabase pair-screen

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/pair-screen/**"
      - "supabase/functions/_shared/**"
  workflow_dispatch:

concurrency:
  group: deploy-pair-screen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pair-screen
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      - name: Validar secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_REF são obrigatórias."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy pair-screen
        run: |
          supabase functions deploy pair-screen \
            --project-ref "$SUPABASE_PROJECT_REF"
